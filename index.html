<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monte a sua pizza</title>
  </head>
  <body>
    <main id="counter" class="counter">
      <header class="topbar">
        <h1>Monte a sua pizza</h1>
        <p class="topbar-tagline">Arraste os ingredientes para a pizza, ou toque neles.</p>
      </header>

      <section id="shelf-sauce" class="shelf shelf--sauce"></section>
      <section id="shelf-topping" class="shelf shelf--topping"></section>

      <div id="stage" class="stage"></div>

      <div class="side">
        <section id="shelf-dough" class="shelf shelf--dough"></section>
        <section id="shelf-cheese" class="shelf shelf--cheese"></section>
        <section id="summary" class="cart" aria-labelledby="summary-title"></section>
      </div>

      <footer class="bar">
        <p id="announcer" class="bar-status" aria-live="polite">Arraste para a pizza ou toque: massa, molho, queijo e até 6 ingredientes.</p>
        <p class="bar-total">Total <strong id="bar-total"></strong></p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
